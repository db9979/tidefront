# TIDEFRONT: docker compose up -d   (arm64 und amd64)
# Nach außen geht nur der HTTP-Port des api-Dienstes (Vorgabe 8080, in .env: TIDEFRONT_PORT).
# TLS übernimmt der vorhandene Proxy; WebSocket läuft über denselben Port (/ws).
name: tidefront

x-app: &app
  image: tidefront:local
  build: .
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://tidefront:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@postgres:5432/tidefront
    VALKEY_URL: redis://valkey:6379
    INVITE_CODES: ${INVITE_CODES:-}
    # Admins (Komma-Liste von Spielernamen); leer: der zuerst registrierte Spieler ist Admin.
    ADMIN_NAMES: ${ADMIN_NAMES:-}
    # Öffentliche Adresse (Links in E-Mails, VAPID-Subject).
    PUBLIC_URL: ${PUBLIC_URL:-https://tidefront.metaluna9.i234.me}
    # Web-Push: ohne Angabe erzeugt migrate die Schlüssel und legt sie in server_setting ab.
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    # Schlüssel für gespeicherte Geheimnisse (SMTP-Passwort); ohne ihn ist E-Mail abgeschaltet.
    APP_SECRET: ${APP_SECRET:-}
    # Sitzungs-Cookie mit Secure: auto (nach X-Forwarded-Proto), true oder false.
    COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    SEASON_DAYS: ${SEASON_DAYS:-28}
    TZ: ${TZ:-Europe/Berlin}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidefront
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: tidefront
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidefront -d tidefront"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "--enable-source-maps", "server/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s

  api:
    <<: *app
    command: ["node", "--enable-source-maps", "server/api.mjs"]
    ports:
      - "${TIDEFRONT_PORT:-8080}:8080"
    # Sicherungen für „Herunterladen“ in der Verwaltung, nur lesend (kein Docker-Zugriff; „Jetzt sichern“
    # läuft über die Tabelle backup_request, die der backup-Dienst jede Minute prüft).
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "server/worker.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: postgres
      PGUSER: tidefront
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      PGDATABASE: tidefront
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "/scripts/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      start_period: 2m

volumes:
  pgdata:
